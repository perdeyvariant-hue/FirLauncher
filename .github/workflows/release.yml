# Builds FirLauncher for Windows, macOS and Linux when a version tag is
# pushed (git tag v0.2.0 && git push origin v0.2.0), publishes a GitHub
# release with the installers, and uploads latest.json for the in-app updater.
#
# Repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY / _PASSWORD  signs the update packages (required)
#   FIRLAUNCHER_CURSEFORGE_KEY             embeds the CurseForge key (optional)
#   FIRLAUNCHER_MSA_CLIENT_ID              embeds the Azure client id (optional)
#   FIRLAUNCHER_DISCORD_APP_ID             embeds the Discord application id (optional)
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          FIRLAUNCHER_CURSEFORGE_KEY: ${{ secrets.FIRLAUNCHER_CURSEFORGE_KEY }}
          FIRLAUNCHER_MSA_CLIENT_ID: ${{ secrets.FIRLAUNCHER_MSA_CLIENT_ID }}
          FIRLAUNCHER_DISCORD_APP_ID: ${{ secrets.FIRLAUNCHER_DISCORD_APP_ID }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: FirLauncher ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseBody: |
            Установщики для Windows (.exe, .msi), macOS (.dmg) и Linux (.AppImage, .deb).
            Уже установленный лаунчер предложит обновиться сам.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
