[package]
name = "firlauncher"
version = "0.2.1"
description = "FirLauncher — minimal, modern Minecraft instance launcher"
authors = ["FirLauncher contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
# The desktop binary links the library; the extra crate types keep mobile
# targets buildable without a second manifest.
name = "firlauncher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "io-util", "sync", "time", "signal"] }
dirs = "5"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "gzip", "rustls", "charset", "form", "query"] }
futures-util = "0.3.34"
sha1 = "0.10"
hex = "0.4.3"
zip = "7.2.0"
tokio-util = { version = "0.7.19", features = ["io"] }
uuid = { version = "1.26.1", features = ["v4", "v3", "serde"] }
sysinfo = "0.36.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
flate2 = "1.1.10"
tar = "0.4.46"
tokio-stream = "0.1.19"
md-5 = "0.10"
parking_lot = "0.12.5"
sha2 = "0.10"
base64 = "0.23.1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
png = "0.18.1"
tauri-plugin-updater = "2.12.0"
tauri-plugin-process = "2.3.1"
regex = "1.13.1"
hickory-resolver = "0.25.2"
url = "2"
tauri-plugin-single-instance = "2.4.5"
discord-rich-presence = "1.1.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
